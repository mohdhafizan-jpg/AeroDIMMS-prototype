<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AeroDIMMS Penang – UI Mockup</title>
<style>
:root{--bg:#F3F6FA;--card:#fff;--tx:#14263A;--mu:#64748B;--bd:#E2E8F0;--bl:#0A6EBD;--nv:#0B3C6B;--or:#F7941D;--bls:#E6F1FA;--ors:#FEF1DF;--rd:#D93A3A;--mapbg:#EAF1F8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A28;--card:#16253A;--tx:#E6EEF7;--mu:#93A4B8;--bd:#25384F;--bls:#12304D;--ors:#3A2A12;--mapbg:#0F2236}}
:root[data-theme="dark"]{--bg:#0F1A28;--card:#16253A;--tx:#E6EEF7;--mu:#93A4B8;--bd:#25384F;--bls:#12304D;--ors:#3A2A12;--mapbg:#0F2236}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--bl);font-size:13px;line-height:1.1;letter-spacing:.6px}
.lg i{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--or) 50%,var(--bl) 50%)}
.lg span{display:block;color:var(--or)}
.sp{flex:1}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
textarea{width:100%;resize:vertical;min-height:60px}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:600;cursor:pointer;color:var(--tx)}
.pill:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--c)}
nav{background:var(--nv);display:flex;overflow-x:auto;padding:0 12px}
nav button{background:0;border:0;color:#CFE3F5;padding:13px 18px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--or)}
#ban{background:var(--ors);color:#9A5200;text-align:center;padding:7px;font-weight:600}
main{max-width:1240px;margin:auto;padding:20px;display:grid;gap:16px}
h2{font-size:22px}h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
small,em{color:var(--mu);font-style:normal;font-size:12px}
.g4,.g3,.g2{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.pn,.kpi,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.kpi{border-left:5px solid var(--bl);cursor:pointer;display:grid}.kpi.or{border-left-color:var(--or)}.kpi.rd{border-left-color:var(--rd)}
.kpi b{font-size:34px;line-height:1.1}.kpi:hover{box-shadow:0 4px 14px #0a6ebd33}
.hello{background:linear-gradient(110deg,var(--nv),var(--bl));color:#fff;border-radius:14px;padding:18px 22px;border-bottom:4px solid var(--or)}.hello p{opacity:.9}
.b{border:0;border-radius:99px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;background:var(--bl);color:#fff}
.b.o{background:var(--or);color:#1b1b1b}.b.g{background:var(--bls);color:var(--bl)}.b.lg2{padding:16px;font-size:15px;border-radius:12px}.b.w{width:100%}.b:disabled{opacity:.4;cursor:not-allowed}
.ch{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.rd{background:#FDE8E8;color:#B42323}.or{background:var(--ors);color:#B4600A}.yl{background:#FFF3C4;color:#7A5C00}.bl{background:var(--bls);color:#0A5E9F}.gn{background:#DFF3E7;color:#1F7A44}.gy{background:#EEF1F5;color:#64748B}
.rdt{color:var(--rd);font-weight:700}
.wrap{overflow-x:auto}.tb{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:middle}th{color:var(--mu);font-size:12px}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--bls)}
.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--or))}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.task>div:first-child{flex:1}.task>div:last-child{display:flex;gap:6px;align-items:center}
.fd{padding:7px 0 7px 12px;border-left:3px solid var(--or);margin-bottom:8px}
.pl{display:flex;gap:8px;overflow-x:auto}.st{flex:1;min-width:112px;padding:10px;border-radius:12px;background:var(--bls);text-align:center;cursor:pointer;border:2px solid transparent}.st.on{border-color:var(--or)}.st b{display:block;font-size:22px;color:var(--bl)}
.sg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.sg button{border:0;background:var(--card);color:var(--tx);padding:9px 16px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.sg .on{background:var(--bl);color:#fff}.sg .f2{background:var(--rd)}.sg .f3{background:var(--mu)}
.bars{display:flex;gap:10px;align-items:flex-end;height:160px}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.bars i{width:100%;background:linear-gradient(var(--or),#fbbf6a);border-radius:6px 6px 0 0;min-height:4px}
.hb{display:grid;grid-template-columns:90px 1fr 24px;gap:8px;align-items:center}
.ov{position:fixed;inset:0;background:#0b1f3a99;z-index:30;display:grid;place-items:center;padding:12px}
.md{background:var(--card);border-radius:16px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:20px;display:grid;gap:12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ck{border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.ff{flex-basis:100%;display:grid;gap:8px;background:var(--ors);padding:10px;border-radius:10px}.ff div{display:flex;gap:8px}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--card);box-shadow:-10px 0 30px #0004;z-index:25;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:grid;gap:12px;align-content:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto}.tabs button{border:0;background:0;color:var(--mu);padding:8px 10px;font:600 13px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent}.tabs .on{color:var(--bl);border-color:var(--or)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px}.dl dt{color:var(--mu)}.dl dd{margin:0}
.ph{height:90px;border-radius:10px;background:repeating-linear-gradient(45deg,var(--bls),var(--bls) 8px,var(--card) 8px,var(--card) 16px);display:grid;place-items:center;color:var(--mu);font-size:12px}
.map{width:100%;border-radius:12px;border:1px solid var(--bd);display:block}.pu{animation:pu 1.6s infinite;fill:#D93A3A}@keyframes pu{from{r:2.4;opacity:.6}to{r:6;opacity:0}}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#fff 40%,var(--bls))}.lgn .card{width:min(420px,100%);display:grid;gap:12px;box-shadow:0 12px 40px #0a6ebd22}.lgn label{display:grid;gap:4px;font-weight:600}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.drop{border:2px dashed var(--or);border-radius:12px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nv);color:#fff;padding:11px 18px;border-radius:10px;z-index:50;border-left:5px solid var(--or)}
.note-box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px;display:grid;gap:8px}
.note-item{padding:8px;background:var(--card);border-radius:8px;border-left:3px solid var(--bl);font-size:12px}
@media(max-width:600px){main{padding:12px}header{padding:8px 12px}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const R={inspector:{n:'Hafizan',id:'PEN12345',l:'Inspector'},maintenance:{n:'Aiman',id:'PEN20871',l:'Maintenance Engineer'},shift:{n:'Meor',id:'PEN30412',l:'Shift Leader'},manager:{n:'Ridzuan',id:'PEN40001',l:'Operations Manager'}};
const SG=['Finding','Assignment','Work Order','In Progress','Pending Verify','Closed'];
const PG=['Dashboard','Inspections','Issues & Actions','Map','Reports'],IC=['▦','☑','⚠','◎','▤'];
const CK=['Surface free of FOD & debris','Centreline / edge lights serviceable','Markings visible and intact','Rubber deposits within limits','Drainage clear'];
let I=[
{id:'FND-024',t:'Runway centreline light U/S',z:'RWY 04',p:'Critical',s:1,src:'Internal',by:'Hafizan',as:'',due:'Today 17:00',x:22,y:43,notes:[{by:'Meor (Shift Leader)',t:'Priority confirmed. Awaiting dispatch.',dt:'06 Oct 08:30'}]},
{id:'FND-021',t:'Taxiway A edge crack',z:'TWY A',p:'High',s:4,src:'Internal',by:'Hafizan',as:'Aiman',due:'2d overdue',od:1,x:45,y:41,notes:[{by:'Ridzuan (Manager)',t:'Monitor crack propagation during next daily inspection.',dt:'05 Oct 14:10'}]},
{id:'FND-019',t:'Apron Bay 3 marking faded',z:'Apron Bay 3',p:'Medium',s:5,src:'Internal',by:'Hafizan',as:'Aiman',due:'Verify today',x:72,y:52,notes:[]},
{id:'CAAM-001',t:'RESA vegetation above limit',z:'RWY 22',p:'High',s:3,src:'ANSA-CAAM',by:'ANSA-CAAM',as:'Aiman',due:'1d overdue',od:1,x:82,y:16,notes:[{by:'Meor (Shift Leader)',t:'Groundskeeping team notified for immediate trimming.',dt:'06 Oct 09:00'}]},
{id:'FND-026',t:'FOD on Apron Bay 5',z:'Apron',p:'High',s:1,src:'Internal',by:'Nurul',as:'',due:'Today 20:00',x:84,y:50,notes:[]},
{id:'FND-017',t:'Bird flock near strip',z:'Strip N',p:'Medium',s:2,src:'Internal',by:'Nurul',as:'Wildlife Team',due:'08 Oct',x:40,y:20,notes:[]},
{id:'FND-015',t:'AFRS foam level low',z:'AFRS',p:'Medium',s:6,src:'Internal',by:'Nurul',as:'Aiman',due:'Closed',x:12,y:54,notes:[]}];
let N=[
{id:'INSP-2026-10-06-01',ty:'Runway 04/22 – Routine',w:'Hafizan',s:'prog',pg:60,tm:'08:00',notes:[{by:'Meor (Shift Leader)',t:'Please pay extra attention to RWY 04 threshold lighting.',dt:'06 Oct 08:15'}]},
{id:'INSP-2026-10-06-02',ty:'Taxiway A – Routine',w:'Hafizan',s:'prog',pg:25,tm:'09:30',notes:[]},
{id:'INSP-2026-10-06-03',ty:'Apron Bay 1–6 – Routine',w:'Hafizan',s:'sch',pg:0,tm:'14:00',notes:[]},
{id:'INSP-2026-10-06-04',ty:'AGL Lighting – Night',w:'Nurul',s:'sch',pg:0,tm:'20:00',notes:[]},
{id:'INSP-2026-10-06-05',ty:'Wildlife Hazard – Strip',w:'Nurul',s:'prog',pg:80,tm:'10:00',notes:[]},
{id:'INSP-2026-10-05-01',ty:'Runway 04/22 – Routine',w:'Hafizan',s:'done',pg:100,tm:'05 Oct',r:'1 finding',notes:[]},
{id:'INSP-2026-10-05-02',ty:'Verification – TWY B light',w:'Nurul',s:'done',pg:100,tm:'05 Oct',r:'Passed',notes:[]}];
let S={role:null,page:'Dashboard',sync:0,dt:0,fs:'All',fg:0,mf:'All',rt:0,cat:'',gen:0,vw:'t',imp:0,inspNotesModal:null};
const pc=p=>({Critical:'rd',High:'or',Medium:'yl'}[p]),sc=s=>s==6?'gn':s==5||s<3?'yl':'bl';
const ch=(t,c)=>`<span class="ch ${c}">${t}</span>`;
const mine=()=>S.role=='inspector'?I.filter(i=>i.by=='Hafizan'):S.role=='maintenance'?I.filter(i=>i.as=='Aiman'):I;
const open=l=>l.filter(i=>i.s<6);
const kpi=(l,v,c,s,go)=>`<div class="kpi ${c}" data-go="${go||''}"><small>${l}</small><b>${v}</b><em>${s||''}</em></div>`;
const pn=(t,b,a='')=>`<section class="pn"><h3><span>${t}</span>${a}</h3>${b}</section>`;
const btn=(t,a,c='',x='')=>`<button class="b ${c}" data-a="${a}" ${x}>${t}</button>`;
const hello=(t,p)=>`<div class="hello"><h2>${t}</h2><p>${p}</p></div>`;
const feed=a=>pn('Recent activity',a.map(([t,x])=>`<div class="fd"><b>${t}</b> ${x}</div>`).join(''));
const bars=d=>{const m=Math.max(...d.map(x=>x[1]));return `<div class="bars">${d.map(([l,v])=>`<div><b>${v}</b><i style="height:${v/m*100}\%"></i><small>${l}</small></div>`).join('')}</div>`};
const hb=(l,v,m)=>`<div class="hb"><span>${l}</span><div class="pg"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`;

function renderNotesSection(item, type='finding'){
 const notes = item.notes || [];
 const canAdd = S.role === 'shift' || S.role === 'manager';
 const notesList = notes.length 
   ? notes.map(n => `<div class="note-item"><b>${n.by}</b> <small>(${n.dt})</small><br>${n.t}</div>`).join('')
   : '<small>No notes added yet.</small>';
 
 const addForm = canAdd ? `
   <div style="display:grid;gap:6px;margin-top:8px">
     <textarea id="newNoteTxt" placeholder="Add shift leader / manager note..."></textarea>
     ${btn('＋ Add Note', 'addnote', 'o', `data-type="${type}" data-id="${item.id}"`)}
   </div>` : '<p style="margin-top:6px"><small><i>Only Shift Leaders and Managers can add notes.</i></small></p>';

 return `<div class="note-box">
   <b>Notes & Leadership Directives (${notes.length})</b>
   <div style="display:grid;gap:6px">${notesList}</div>
   ${addForm}
 </div>`;
}

function act(i){const r=S.role,d=`data-i="${i.id}"`;
 if(r=='shift'&&i.s==1)return btn('Assign + WO','assign','o',d);
 if(r=='shift'&&i.s==5)return btn('Verify','open','o',d);
 if(r=='maintenance'&&(i.s==3||i.s==4))return btn(i.s==3?'Start work':'Submit proof','proof','o',d);
 return btn('View','open','g',d)}
const tbl=l=>`<div class="wrap"><table class="tb"><tr><th>ID<th>Issue<th>Zone<th>Priority<th>Stage<th>Due<th></tr>${l.map(i=>`<tr data-a="open" data-i="${i.id}"><td><b>${i.id}</b>${i.src!='Internal'?' '+ch('CAAM','bl'):''}<td>${i.t}<td>${i.z}<td>${ch(i.p,pc(i.p))}<td>${ch(SG[i.s-1],sc(i.s))}<td class="${i.od?'rdt':''}">${i.due}<td>${act(i)}</tr>`).join('')||'<tr><td colspan="7">Nothing here yet.</tr>'}</table></div>`;

function inRow(n){const r=S.role;let a='';
 if(r=='inspector')a=btn(n.s=='sch'?'Start':n.s=='prog'?'Continue':'View',n.s=='done'?'toast':'exec',n.s=='done'?'g':'o',`data-i="${n.id}" data-v="Completed record opened"`);
 else if(r=='shift')a=btn('Details / Notes','viewinsp','g',`data-i="${n.id}"`)+ ' ' + btn(n.s=='sch'?'Reassign':'View','toast','g','data-v="'+(n.s=='sch'?'Choose a team to reassign':'Inspection details opened')+'"');
 else a=btn('Details / Notes','viewinsp','g',`data-i="${n.id}"`);
 return `<div class="task"><div><b>${n.id}</b><br><small>${n.ty} · ${n.w} · ${n.tm}</small>${n.notes&&n.notes.length?` <small class="ch bl">${n.notes.length} notes</small>`:''}${n.s=='prog'?`<div class="pg"><i style="width:${n.pg}%"></i></div>`:''}</div><div>${n.r?ch(n.r,'gn'):''}${a}</div></div>`}
const myN=()=>N.filter(n=>S.role=='inspector'?n.w=='Hafizan':S.role=='maintenance'?/Verification/.test(n.ty):1);

const D={
inspector(){const m=mine(),o=open(m),q=myN().filter(n=>n.s!='done');return hello('Good morning, Hafizan',`${N.filter(n=>n.w=='Hafizan'&&n.s=='prog').length} inspections in progress · everything you record is saved on this device first.`)+
`<div class="g3">${btn('＋ Log defect','toast','o lg2','data-v="Quick finding form opened"')}${btn('📷 Snap photo','toast','g lg2','data-v="Photo attached to current inspection"')}${btn('📍 Drop GPS pin','toast','g lg2','data-v="GPS captured: 5.2971°N, 100.2768°E"')}</div>
<div class="g4">${kpi('My active inspections',N.filter(n=>n.w=='Hafizan'&&n.s=='prog').length,'','In progress','Inspections')}${kpi('Scheduled today',N.filter(n=>n.w=='Hafizan'&&n.s=='sch').length,'or','Next 14:00','Inspections')}${kpi('Findings raised',m.length,'',`${o.length} still open`,'Issues & Actions')}${kpi('Critical',m.filter(i=>i.p=='Critical'&&i.s<6).length,'rd','Needs action','Issues & Actions')}</div>
<div class="g2">${pn('My inspection queue',q.map(inRow).join(''))}${feed([['10:32','Inspection started – Runway 04/22'],['10:15','Finding FND-021 created – Taxiway A'],['09:50','FND-019 repair submitted for your verification']])}</div>
${pn('Findings raised',tbl(o))}`},
maintenance(){const m=open(mine()),o={Critical:0,High:1,Medium:2},t=[...m].sort((a,b)=>o[a.p]-o[b.p]),x=t[0];return hello('Good morning, Aiman',`${m.length} work orders assigned · ${m.filter(i=>i.od).length} overdue.`)+
`<div class="g4">${kpi('My work orders',m.length,'','Open','Issues & Actions')}${kpi('Overdue',m.filter(i=>i.od).length,'rd','Past SLA','Issues & Actions')}${kpi('In progress',m.filter(i=>i.s==4).length,'','Active','Issues & Actions')}${kpi('Awaiting verification',m.filter(i=>i.s==5).length,'or','With Shift Leader','Issues & Actions')}</div>
<div class="g2">${pn('My tasks – by severity',t.map(i=>`<div class="task"><div>${ch(i.p,pc(i.p))} <b>${i.id}</b>${i.t}<br><small>${i.z} ·${i.s>=3?SG[i.s-1]:'Assigned'} · <span class="${i.od?'rdt':''}">${i.due}</span></small></div><div>${act(i)}</div></div>`).join(''))}
${x?pn('Task workspace',`<dl class="dl"><dt>Task<dd><b>${x.id}</b>${x.t}<dt>Location<dd>${x.z} ·${x.x}, ${x.y}<dt>Priority<dd>${ch(x.p,pc(x.p))}</dl><br>${btn('📷 Submit proof of fix','proof','o lg2 w','data-i="'+x.id+'"')}<br><br>${btn('View on map','nav','g w','data-v="Map"')}`):''}</div>`},
shift(){const a=open(I);return hello('Shift board – Meor','Bravo team is on Taxiway A · 2 items need your decision.')+
`<div class="g4">${kpi('Active inspections',N.filter(n=>n.s=='prog').length,'','Across 3 teams','Inspections')}${kpi('Awaiting triage',a.filter(i=>i.s==1).length,'or','Assign + create WO','Issues & Actions')}${kpi('Pending verification',a.filter(i=>i.s==5).length,'or','Sign-off needed','Issues & Actions')}${kpi('Overdue',a.filter(i=>i.od).length,'rd','Escalate','Issues & Actions')}</div>
<div class="g2">${pn('Live shift board',[['Alpha','Runway 04/22 inspection',70],['Bravo','Taxiway A repair',45],['Charlie','Apron AGL check',100],['Delta','Standby',0]].map(([n,t,p])=>`<div class="task"><div><b>Team ${n}</b> <small>${t}</small><div class="pg"><i style="width:${p}\%"></i></div></div><div>${ch(p==100?'Done':p?'Active':'Idle',p==100?'gn':p?'bl':'gy')}</div></div>`).join(''))}
${pn('Urgent alerts',a.filter(i=>i.p=='Critical'||i.od).map(i=>`<div class="fd" style="border-color:var(--rd)"><b>${i.p=='Critical'?'CRITICAL':'OVERDUE'}</b>${i.id} · ${i.t} (${i.z})</div>`).join(''))}</div>
${pn('Approval queue',tbl(a.filter(i=>i.s==1||i.s==5)))}`},
manager(){const a=open(I),c=I.filter(i=>i.src!='Internal'),zs={};a.forEach(i=>zs[i.z]=(zs[i.z]||0)+1);return hello('Operations overview – Ridzuan','Penang International Airport (PEN) · read-only oversight with compliance reporting.')+
`<div class="g4">${kpi('Open findings',a.length,'','Across all sources','Issues & Actions')}${kpi('SLA compliance','94%','or','Target 90%','Reports')}${kpi('Overdue items',a.filter(i=>i.od).length,'rd','Past SLA','Issues & Actions')}${kpi('ANSA-CAAM open',c.filter(i=>i.s<6).length,'or',c.length+' regulatory total','Issues & Actions')}</div>
<div class="g2">${pn('Findings raised – last 6 months',bars([['Apr',9],['May',12],['Jun',8],['Jul',14],['Aug',10],['Sep',7]]))}
${pn('SLA tracker – avg time to resolve',[['Critical','4.2h of 6h',70],['High','1.8d of 3d',60],['Medium','5.1d of 7d',73]].map(([l,t,p])=>`<div><div class="hd"><b>${l}</b><small>${t}</small></div><div class="pg"><i style="width:${p}%"></i></div></div>`).join(''))}
${pn('Open findings by zone',Object.entries(zs).map(([k,v])=>hb(k,v,3)).join(''))}
